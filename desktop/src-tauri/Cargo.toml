[package]
name = "agent-shell"
version = "0.1.0"
description = "LanternLogic Agent — 本地优先的执行智能体"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
